
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RobotCar Remote</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #151923;
  color: white;
  text-align: center;
  margin: 0;
  padding: 20px;
}

h1 { margin-top: 20px; }

button {
  border: none;
  border-radius: 18px;
  font-size: 24px;
  font-weight: bold;
  color: white;
  background: #303b50;
  width: 100px;
  height: 90px;
  touch-action: none;
  user-select: none;
}

button:active { background: #1677ee; }

.stop {
  background: #d93636;
}

.connect {
  background: #168b59;
  width: 220px;
  height: 55px;
  font-size: 18px;
  margin: 15px;
}

.remote {
  display: grid;
  grid-template-columns: repeat(3, 100px);
  gap: 12px;
  justify-content: center;
  margin-top: 35px;
}

#status {
  color: #ffc857;
  margin-top: 15px;
}
</style>
</head>

<body>

<h1>🚗 RobotCar Remote</h1>

<p id="status">Not connected</p>

<button class="connect" id="connect">
Connect to RobotCar
</button>

<div class="remote">

  <div></div>
  <button data-command="F">⬆<br>Forward</button>
  <div></div>

  <button data-command="L">⬅<br>Left</button>
  <button class="stop" data-command="S">STOP</button>
  <button data-command="R">➡<br>Right</button>

  <div></div>
  <button data-command="B">⬇<br>Backward</button>
  <div></div>

</div>

<script>
const SERVICE_UUID =
"12345678-1234-1234-1234-123456789000";

const CHARACTERISTIC_UUID =
"12345678-1234-1234-1234-123456789001";

let device;
let characteristic;

const status = document.getElementById("status");

function setStatus(message) {
  status.textContent = message;
}

async function sendCommand(command) {
  if (!characteristic) return;

  try {
    await characteristic.writeValue(
      new TextEncoder().encode(command)
    );
  } catch (error) {
    setStatus("Command error: " + error.message);
  }
}

document.getElementById("connect").onclick =
async function() {

  try {
    device = await navigator.bluetooth.requestDevice({
      filters: [{ name: "RobotCar" }],
      optionalServices: [SERVICE_UUID]
    });

    setStatus("Connecting...");

    device.addEventListener(
      "gattserverdisconnected", () => {
        characteristic = null;
        setStatus("Disconnected - motors stopped");
      }
    );

    const server = await device.gatt.connect();

    const service =
      await server.getPrimaryService(SERVICE_UUID);

    characteristic =
      await service.getCharacteristic(CHARACTERISTIC_UUID);

    await sendCommand("S");

    setStatus("Connected to RobotCar!");

  } catch(error) {
    setStatus("Connection failed: " + error.message);
  }
};

// Hold a direction to move.
// Release to stop.
document.querySelectorAll("[data-command]").forEach(button => {

  button.addEventListener("pointerdown", event => {
    event.preventDefault();
    if (button.dataset.command !== "S") {
      button.setPointerCapture(event.pointerId);
    }
    sendCommand(button.dataset.command);
  });

  button.addEventListener("pointerup", () => {
    if (button.dataset.command !== "S") {
      sendCommand("S");
    }
  });

  button.addEventListener("pointercancel", () => {
    sendCommand("S");
  });
});

window.addEventListener("blur", () => sendCommand("S"));

</script>

</body>
</html>
